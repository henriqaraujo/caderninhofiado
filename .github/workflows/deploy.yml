name: Deploy via ftp
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      # Monta a pasta "dist" só com os arquivos do site (sem .git, .github etc.)
      - name: Preparar pasta dist
        run: |
          mkdir dist
          cp -r index.html sw.js manifest.webmanifest .htaccess css js fonts icons dist/

      - name: FTP Deploy Locaweb
        uses: locaweb/ftp-deploy@1.0.0
        with:
          host: ${{ secrets.HOST }}
          user: ${{ secrets.USER }}
          password: ${{ secrets.PASS }}
          localDir: "dist"
          remoteDir: "public_html/caderninhofiado"
